name: CI pour le projet Django

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lancer les tests unitaires
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"] # On peut tester sur plusieurs versions ici
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - name: 1. Checkout du code
        uses: actions/checkout@v4

      - name: 2. Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 3. Cache des dépendances pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 4. Installation des dépendances
        working-directory: ./backend/todo_project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
        # - name: 5.Exécution du linter
        #   run: flake8 .
        
      - name: 6. Exécution des tests
        working-directory: ./backend/todo_project
        run: pytest